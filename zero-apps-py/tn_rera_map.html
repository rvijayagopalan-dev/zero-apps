    <div id="map_canvas" style="width: 100%; height: 100%;" />

<script>
function addInfoWindows(map){
  var markers = [{lat:11.1271225, lng:78.6568942, title:'TN/20/Building/Offline/0001/2025 dated 14/05/2025', info:"<b>Builder:</b> 1) M/s. St.Angelo's VNCT Ventures LLP and 2) Thiru. Malayalingam, No.2, Sun Centre, First Floor, Tank Bund Road, Nungambakkam, Chennai – 600034.<br><b>Project:</b> TN/20/Building/Offline/0001/2025 dated 14/05/2025<br><b>Price:</b> Project Name: “Garden Villas” - Construction of Registration of Residential Building’s with 64 Individual Units in the land comprised in S.Nos.220/2A1, 220/6, 220/5A, 221/1A of Kodikulam IInd Bit Village, Madurai North Taluk, Madurai District.<br><b>Location:</b> Approval Details"}];
  var infowindow = new google.maps.InfoWindow();
  for (var i=0; i<markers.length; i++) {
    (function(m) {
      var marker = new google.maps.Marker({
        position: {lat: m.lat, lng: m.lng},
        map: map,
        title: m.title
      });
      google.maps.event.addListener(marker, 'mouseover', function() {
        infowindow.setContent(m.info);
        infowindow.open(map, marker);
      });
      google.maps.event.addListener(marker, 'mouseout', function() {
        infowindow.close();
      });
      google.maps.event.addListener(marker, 'click', function() {
        infowindow.setContent(m.info);
        infowindow.open(map, marker);
      });
    })(markers[i]);
  }
}

if (typeof google !== "undefined" && google.maps && google.maps.event) {
  google.maps.event.addListenerOnce(window, 'load', function() {
    if (window.map_0) {
      addInfoWindows(window.map_0);
    }
  });
}
</script>
